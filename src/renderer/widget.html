<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Typeless Widget</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: transparent;
        overflow: hidden;
        -webkit-app-region: drag;
      }

      .widget {
        width: 280px;
        height: 56px;
        background: rgba(22, 22, 38, 0.85);
        border-radius: 14px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 10px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #3a3a5a;
        transition: all 0.3s ease;
        flex-shrink: 0;
      }

      .status-dot.recording {
        background: #e94560;
        box-shadow: 0 0 8px rgba(233, 69, 96, 0.6);
        animation: dotPulse 1.5s ease-in-out infinite;
      }

      .status-dot.processing {
        background: #ffc107;
        box-shadow: 0 0 8px rgba(255, 193, 7, 0.5);
        animation: dotPulse 0.8s ease-in-out infinite;
      }

      @keyframes dotPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.3);
        }
      }

      .status-text {
        flex: 1;
        font-size: 12px;
        color: rgba(234, 234, 234, 0.9);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: 0.2px;
      }

      .waveform {
        display: none;
        align-items: center;
        gap: 2px;
        height: 24px;
        flex-shrink: 0;
      }

      .widget.recording .waveform {
        display: flex;
      }

      .waveform .bar {
        width: 3px;
        background: #e94560;
        border-radius: 1.5px;
        animation: wave 0.6s ease-in-out infinite;
        opacity: 0.8;
      }

      .waveform .bar:nth-child(1) {
        animation-delay: 0s;
        height: 8px;
      }
      .waveform .bar:nth-child(2) {
        animation-delay: 0.08s;
        height: 12px;
      }
      .waveform .bar:nth-child(3) {
        animation-delay: 0.16s;
        height: 16px;
      }
      .waveform .bar:nth-child(4) {
        animation-delay: 0.24s;
        height: 20px;
      }
      .waveform .bar:nth-child(5) {
        animation-delay: 0.32s;
        height: 16px;
      }
      .waveform .bar:nth-child(6) {
        animation-delay: 0.4s;
        height: 12px;
      }
      .waveform .bar:nth-child(7) {
        animation-delay: 0.48s;
        height: 8px;
      }
      .waveform .bar:nth-child(8) {
        animation-delay: 0.56s;
        height: 6px;
      }

      @keyframes wave {
        0%,
        100% {
          transform: scaleY(0.4);
        }
        50% {
          transform: scaleY(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="widget" class="widget">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text" class="status-text">Ready</span>
      <div class="waveform">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

    <script>
      const widget = document.getElementById('widget')
      const statusDot = document.getElementById('status-dot')
      const statusText = document.getElementById('status-text')

      window.api?.onRecordingStateChanged?.((state) => {
        widget.classList.remove('recording', 'processing')

        if (state.isProcessing) {
          widget.classList.add('processing')
          statusDot.classList.remove('recording')
          statusDot.classList.add('processing')
          statusText.textContent = 'Processing...'
        } else if (state.isRecording) {
          widget.classList.add('recording')
          statusDot.classList.remove('processing')
          statusDot.classList.add('recording')
          statusText.textContent = 'Listening...'
        } else {
          statusDot.classList.remove('recording', 'processing')
          statusText.textContent = 'Ready'
        }
      })

      window.api?.onTranscriptionPartial?.((data) => {
        if (data.rawText) {
          statusText.textContent = data.rawText.slice(-40)
        }
      })
    </script>
  </body>
</html>
